<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="200" height="200" rx="46" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="196" height="196" rx="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Decorative Document Background -->
  <g filter="url(#shadow)">
    <rect x="42" y="32" width="116" height="136" rx="10" fill="url(#cardGrad)" />
    <!-- Document Fold Corner -->
    <path d="M130 32 L158 60 L130 60 Z" fill="#cbd5e1" />
    <path d="M130 32 L158 60 L130 60 Z" fill="rgba(0,0,0,0.08)" />
    <!-- Graduation Cap / Thesis Emblem -->
    <path d="M100 52 L124 64 L100 76 L76 64 Z" fill="#0f172a" />
    <path d="M86 70 L86 85 Q100 93 114 85 L114 70" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <path d="M122 65 L126 84" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="126" cy="85" r="2.5" fill="#d97706" />

    <!-- Document Lines -->
    <rect x="60" y="94" width="80" height="4" rx="2" fill="#94a3b8" />
    <rect x="60" y="104" width="65" height="4" rx="2" fill="#cbd5e1" />

    <!-- LaTeX Typography Brand Box -->
    <rect x="52" y="118" width="96" height="34" rx="6" fill="#0f172a" />
    <text x="100" y="141" font-family="'Times New Roman', 'Latin Modern Roman', serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      L<tspan dy="-3" font-size="16">A</tspan><tspan dy="3">T</tspan><tspan dy="4" font-size="18">E</tspan><tspan dy="-4">X</tspan>
    </text>
  </g>

  <!-- Overleaf Leaf Badge in bottom right -->
  <g transform="translate(138, 138)">
    <circle cx="16" cy="16" r="22" fill="#0f172a" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    <path d="M16 6 C24 6 27 12 27 19 C27 26 21 27 16 27 C16 20 16 13 16 6 Z" fill="url(#leafGrad)" />
    <path d="M16 6 C8 6 5 12 5 19 C5 26 11 27 16 27 Z" fill="#15803d" />
  </g>
</svg>

