<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="50%" stop-color="#171d2b" />
      <stop offset="100%" stop-color="#1a2233" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2535" />
      <stop offset="100%" stop-color="#181f2c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b9cb8" />
      <stop offset="100%" stop-color="#98b6cf" />
    </linearGradient>
    <linearGradient id="overleafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7a4f" />
      <stop offset="100%" stop-color="#1c5536" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="280" fill="url(#bgGrad1)" />

  <!-- Subtle Mathematical / Editorial Grid -->
  <g stroke="#263147" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="600" y2="40" stroke-dasharray="4 6" />
    <line x1="0" y1="80" x2="600" y2="80" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="600" y2="120" stroke-dasharray="4 6" />
    <line x1="0" y1="160" x2="600" y2="160" stroke-dasharray="4 6" />
    <line x1="0" y1="200" x2="600" y2="200" stroke-dasharray="4 6" />
    <line x1="0" y1="240" x2="600" y2="240" stroke-dasharray="4 6" />
    <line x1="100" y1="0" x2="100" y2="280" stroke-dasharray="4 6" />
    <line x1="200" y1="0" x2="200" y2="280" stroke-dasharray="4 6" />
    <line x1="300" y1="0" x2="300" y2="280" stroke-dasharray="4 6" />
    <line x1="400" y1="0" x2="400" y2="280" stroke-dasharray="4 6" />
    <line x1="500" y1="0" x2="500" y2="280" stroke-dasharray="4 6" />
  </g>

  <!-- Left: Stylized Thesis Page Mockup -->
  <g transform="translate(60, 36)" filter="url(#shadow1)">
    <!-- Document Sheet -->
    <rect width="155" height="208" rx="8" fill="url(#pageGrad)" stroke="#333f57" stroke-width="1.5" />
    
    <!-- Carleton Raven / Dark Red Top Header Strip -->
    <rect x="0" y="0" width="155" height="12" rx="6" fill="#8c1d2d" opacity="0.85" />
    <rect x="0" y="6" width="155" height="6" fill="#8c1d2d" opacity="0.85" />
    
    <!-- Title Lines -->
    <rect x="22" y="30" width="111" height="6" rx="3" fill="#cbd5e1" opacity="0.9" />
    <rect x="35" y="42" width="85" height="5" rx="2.5" fill="#94a3b8" opacity="0.65" />
    
    <!-- University Seal / Shield Outline -->
    <circle cx="77" cy="80" r="18" fill="none" stroke="#7b9cb8" stroke-width="1.5" stroke-dasharray="3 2" />
    <path d="M77 68 L87 76 L77 92 L67 76 Z" fill="#7b9cb8" opacity="0.4" />
    
    <!-- Thesis Meta Lines -->
    <rect x="25" y="112" width="105" height="3.5" rx="1.5" fill="#64748b" opacity="0.6" />
    <rect x="32" y="122" width="91" height="3.5" rx="1.5" fill="#64748b" opacity="0.6" />
    <rect x="42" y="132" width="71" height="3.5" rx="1.5" fill="#64748b" opacity="0.5" />
    
    <!-- Chapter Section Preview -->
    <rect x="20" y="152" width="45" height="5" rx="2" fill="#7b9cb8" opacity="0.8" />
    <rect x="20" y="164" width="115" height="3" rx="1.5" fill="#475569" opacity="0.5" />
    <rect x="20" y="172" width="115" height="3" rx="1.5" fill="#475569" opacity="0.5" />
    <rect x="20" y="180" width="90" height="3" rx="1.5" fill="#475569" opacity="0.5" />
    
    <!-- Bottom Page Number -->
    <text x="77" y="198" font-family="monospace" font-size="8" fill="#64748b" text-anchor="middle">i</text>
  </g>

  <!-- Right: Overleaf TeX Code Editor Mockup -->
  <g transform="translate(255, 36)" filter="url(#shadow1)">
    <!-- Editor Window -->
    <rect width="285" height="208" rx="8" fill="#131924" stroke="#2a354a" stroke-width="1.5" />
    
    <!-- Window Titlebar -->
    <path d="M 0 8 Q 0 0 8 0 L 277 0 Q 285 0 285 8 L 285 30 L 0 30 Z" fill="#1b2332" />
    <circle cx="16" cy="15" r="4" fill="#e05252" opacity="0.8" />
    <circle cx="28" cy="15" r="4" fill="#e5c07b" opacity="0.8" />
    <circle cx="40" cy="15" r="4" fill="#98c379" opacity="0.8" />
    
    <!-- File Tab -->
    <rect x="62" y="7" width="110" height="23" rx="4" fill="#131924" />
    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">carleton.tex</text>
    
    <!-- Overleaf Pill Badge -->
    <g transform="translate(205, 8)">
      <rect width="68" height="15" rx="7.5" fill="url(#overleafGrad)" />
      <text x="34" y="11" font-family="sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">OVERLEAF</text>
    </g>

    <!-- Code Line Numbers and LaTeX Syntax -->
    <g font-family="'JetBrains Mono', 'Iosevka', monospace" font-size="10" xml:space="preserve">
      <!-- Line 1 -->
      <text x="14" y="55" fill="#475569" font-size="9">1</text>
      <text x="32" y="55" fill="#e06c75">\documentclass</text>
      <text x="120" y="55" fill="#e5c07b">{carleton-thesis}</text>

      <!-- Line 2 -->
      <text x="14" y="77" fill="#475569" font-size="9">2</text>
      <text x="32" y="77" fill="#7b9cb8">% Carleton University PhD Template</text>

      <!-- Line 3 -->
      <text x="14" y="99" fill="#475569" font-size="9">3</text>
      <text x="32" y="99" fill="#e06c75">\usepackage</text>
      <text x="100" y="99" fill="#e5c07b">{amsmath, amssymb}</text>

      <!-- Line 4 -->
      <text x="14" y="121" fill="#475569" font-size="9">4</text>
      <text x="32" y="121" fill="#c678dd">\begin</text>
      <text x="68" y="121" fill="#e5c07b">{document}</text>

      <!-- Line 5 -->
      <text x="14" y="143" fill="#475569" font-size="9">5</text>
      <text x="44" y="143" fill="#61afef">\title</text>
      <text x="80" y="143" fill="#98c379">{PhD Dissertation}</text>

      <!-- Line 6 -->
      <text x="14" y="165" fill="#475569" font-size="9">6</text>
      <text x="44" y="165" fill="#61afef">\author</text>
      <text x="88" y="165" fill="#98c379">{Luis Lopez Diaz}</text>

      <!-- Line 7 -->
      <text x="14" y="187" fill="#475569" font-size="9">7</text>
      <text x="44" y="187" fill="#e06c75">\maketitle</text>
    </g>

    <!-- Cursor -->
    <rect x="114" y="177" width="7" height="12" fill="#7b9cb8" opacity="0.8">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- LaTeX Official Watermark Badge -->
  <g transform="translate(480, 218)">
    <rect width="68" height="26" rx="6" fill="#1b2332" stroke="#333f57" stroke-width="1" />
    <text x="34" y="17" font-family="'Computer Modern Serif', serif" font-weight="bold" font-size="12" fill="#cbd5e1" text-anchor="middle">L<tspan dy="2" font-size="9">A</tspan><tspan dy="-2">T</tspan><tspan dy="2" font-size="9">E</tspan><tspan dy="-2">X</tspan></text>
  </g>
</svg>

